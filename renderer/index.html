<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self'; worker-src 'self' blob:; img-src 'self' data:;">
  <title>Kovix</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="chat/chat.css">
  <link rel="stylesheet" href="filetree/filetree.css">
  <link rel="stylesheet" href="editor/editor.css">
  <style>
    /* ==========================================================================
       Layout B — Premium Chromium-style three-pane layout
       ========================================================================== */

    /* Custom title bar (frameless window) */
    #titlebar {
      display: flex;
      align-items: center;
      height: 32px;
      background: #010409;
      flex-shrink: 0;
      -webkit-app-region: drag;   /* Entire bar is draggable */
      user-select: none;
      border-bottom: 1px solid #21262d;
    }

    #titlebar-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 32px;
      -webkit-app-region: no-drag;
    }

    #titlebar-icon .logo {
      color: #7c83ff;
      font-size: 14px;
      font-weight: 700;
    }

    #titlebar-menu {
      display: flex;
      align-items: center;
      gap: 1px;
      height: 32px;
      -webkit-app-region: no-drag;
    }

    .titlebar-menu-item {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 120ms ease, color 120ms ease;
    }

    .titlebar-menu-item:hover {
      background: #161b22;
      color: #c9d1d9;
    }

    #titlebar-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #484f58;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    #titlebar-controls {
      display: flex;
      align-items: center;
      height: 32px;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 32px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }

    .titlebar-btn:hover {
      background: #21262d;
      color: #c9d1d9;
    }

    .titlebar-btn.close:hover {
      background: #da3633;
      color: #fff;
    }

    .titlebar-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Toolbar bar (below title bar) */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      background: #010409;
      border-bottom: 1px solid #21262d;
      min-height: 40px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-right {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .toolbar-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 120ms ease, color 120ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toolbar-btn:hover {
      background: #161b22;
      color: #c9d1d9;
    }

    .toolbar-btn.active {
      background: #7c83ff20;
      color: #7c83ff;
    }

    /* Provider & model selects — Chromium pill style */
    .toolbar-select {
      background: #0d1117;
      color: #8b949e;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease;
      outline: none;
    }

    .toolbar-select:hover {
      border-color: #7c83ff;
      color: #c9d1d9;
    }

    .toolbar-select:focus {
      border-color: #7c83ff;
    }

    /* Mode toggle — segmented pill */
    .mode-toggle {
      display: flex;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-btn {
      background: none;
      border: none;
      color: #484f58;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .mode-btn:hover {
      color: #8b949e;
      background: #161b22;
    }

    .mode-btn.active {
      background: #7c83ff;
      color: #fff;
    }

    /* Main app container */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #layout-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* File tree pane */
    #pane-filetree {
      width: 260px;
      min-width: 180px;
      max-width: 420px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #010409;
      border-right: 1px solid #21262d;
    }

    /* Editor pane */
    #pane-editor {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0d1117;
    }

    /* Tab bar */
    #tab-bar {
      display: flex;
      align-items: stretch;
      background: #010409;
      border-bottom: 1px solid #21262d;
      min-height: 36px;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #tab-bar::-webkit-scrollbar {
      height: 3px;
    }

    #tab-bar::-webkit-scrollbar-thumb {
      background: #21262d;
      border-radius: 3px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      min-width: 120px;
      max-width: 200px;
      background: #010409;
      border-right: 1px solid #21262d;
      cursor: pointer;
      transition: background 120ms ease;
      flex-shrink: 0;
      position: relative;
    }

    .tab:hover {
      background: #0d1117;
    }

    .tab.active {
      background: #0d1117;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #7c83ff;
    }

    .tab-icon {
      font-size: 12px;
      flex-shrink: 0;
    }

    .tab-name {
      font-size: 12px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .tab.active .tab-name {
      color: #c9d1d9;
    }

    .tab-close {
      background: none;
      border: none;
      color: #484f58;
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      transition: background 120ms ease, color 120ms ease;
      flex-shrink: 0;
    }

    .tab-close:hover {
      background: #da363340;
      color: #da3633;
    }

    .tab.has-pending .tab-name {
      color: #d29922;
    }

    /* Editor header (breadcrumb) */
    .editor-header {
      display: flex;
      align-items: center;
      padding: 2px 12px;
      background: #0d1117;
      border-bottom: 1px solid #161b22;
      flex-shrink: 0;
      min-height: 26px;
    }

    .editor-file-path {
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 11px;
      color: #484f58;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* Chat pane */
    #pane-chat {
      width: 380px;
      min-width: 280px;
      max-width: 600px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid #21262d;
      background: #010409;
    }

    /* Resize handles */
    .resize-handle {
      width: 3px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      transition: background 120ms ease;
      z-index: 10;
    }

    .resize-handle:hover,
    .resize-handle.active {
      background: #7c83ff;
    }

    /* Mobile/small screen */
    @media (max-width: 800px) {
      #layout-body {
        flex-direction: column;
      }
      #pane-filetree {
        width: 100%;
        max-width: none;
        height: 200px;
        min-height: 100px;
        max-height: 300px;
        border-right: none;
        border-bottom: 1px solid #21262d;
      }
      #pane-editor {
        min-width: 0;
      }
      #pane-chat {
        width: 100%;
        max-width: none;
        height: 300px;
        min-height: 150px;
        border-left: none;
        border-top: 1px solid #21262d;
      }
      .resize-handle {
        width: 100%;
        height: 3px;
        cursor: row-resize;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Custom Title Bar (frameless window) -->
    <div id="titlebar">
      <div id="titlebar-icon">
        <span class="logo">◆</span>
      </div>
      <div id="titlebar-menu">
        <button class="titlebar-menu-item" id="btn-folder">File</button>
        <button class="titlebar-menu-item" id="btn-edit-menu">Edit</button>
        <button class="titlebar-menu-item" id="btn-view-menu">View</button>
      </div>
      <span id="titlebar-title">Kovix</span>
      <div id="titlebar-controls">
        <button class="titlebar-btn" id="btn-window-minimize" title="Minimize">
          <svg viewBox="0 0 16 16"><rect y="7" width="16" height="2" rx="1"/></svg>
        </button>
        <button class="titlebar-btn" id="btn-window-maximize" title="Maximize">
          <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="titlebar-btn close" id="btn-window-close" title="Close">

        </button>
      </div>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
      <div class="toolbar-left">
        <select id="provider-select" class="toolbar-select" title="AI provider">

          <option value="nvidia-nim">NVIDIA NIM</option>

      </div>

      <!-- Center: Editor -->

        <div id="tab-bar"></div>

      <div class="resize-handle" id="resize-editor-chat"></div>

      <!-- Right: Chat -->
      <div id="pane-chat">

  <!-- Settings modal -->

  <!-- Monaco AMD loader -->
  <script src="monaco/vs/loader.js"></script>
  <script>
    require.config({
      paths: {
        'vs': 'monaco/vs'
      }
    });
  </script>

  <!-- Component scripts -->
  <script src="filetree/filetree.js"></script>
  <script src="editor/editor.js"></script>
  <script src="chat/chat.js"></script>

  <!-- Layout coordination script -->
  <script>
    /**
     * Layout B coordinator — wires file tree, editor, tabs, and chat together.
     */

    // api is already declared by chat.js — reuse it.
    // DO NOT redeclare with const/let/var.

    // ---- Window controls (frameless title bar) ----

    document.getElementById('btn-window-minimize').addEventListener('click', () => {
      api.windowMinimize();
    });
    document.getElementById('btn-window-maximize').addEventListener('click', async () => {
      await api.windowMaximize();
    });
    document.getElementById('btn-window-close').addEventListener('click', () => {
      api.windowClose();
    });

    // ---- File menu is handled by chat.js btnFolder listener ----

    // ---- Initialize components ----

    let fileTree = null;
    let kovixEditor = null;

    // Tab management state
    const openTabs = [];      // [{filePath, name}]
    let activeTabPath = null;

    async function initLayout() {
      console.log('[Layout] initLayout() starting...');

      // Initialize file tree
      const treeContainer = document.getElementById('file-tree-container');
      if (!treeContainer) {
        console.error('[Layout] file-tree-container not found!');
      }
      fileTree = new KovixFileTree(treeContainer, api, {
        onFileSelect: (filePath) => handleFileSelect(filePath),
      });
      window.fileTree = fileTree;
      console.log('[Layout] fileTree created');

      // Load workspace into tree
      try {
        const appState = await api.getAppState();
        if (appState.workspaceRoots && appState.workspaceRoots.length > 0) {
          await fileTree.setWorkspaceRoot(appState.workspaceRoots[0]);
        }
      } catch (err) {
        console.error('[Layout] Failed to load workspace roots:', err);
      }

      // Initialize Monaco editor
      const editorContainer = document.getElementById('editor-container');
      const editorHeader = document.getElementById('editor-header');
      kovixEditor = new KovixEditor(editorContainer, editorHeader, api, {
        onAccept: (filePath) => handleChangeResolved(filePath),
        onReject: (filePath) => handleChangeResolved(filePath),
        onFileOpen: (filePath) => openTab(filePath),
      });

      kovixEditor.init().then(() => {
        console.log('[Layout] Monaco editor initialized');
      }).catch(err => {
        console.error('[Layout] Monaco init failed:', err);
      });

      // Refresh tree button
      document.getElementById('btn-refresh-tree').addEventListener('click', () => {
        if (fileTree.workspaceRoot) fileTree.refresh();
      });

      // Resize handles
      setupResizeHandles();

      // Pending changes sync
      setupPendingChangesSync();
    }

    // ---- Tab management ----

    function getFileName(filePath) {
      if (!filePath) return '';
      return filePath.split('/').pop() || filePath.split('\\').pop() || filePath;
    }

    function openTab(filePath) {
      // Check if tab already exists
      const existing = openTabs.find(t => t.filePath === filePath);
      if (!existing) {
        openTabs.push({ filePath, name: getFileName(filePath) });
      }
      activeTabPath = filePath;
      renderTabs();
    }

    function closeTab(filePath) {
      const idx = openTabs.findIndex(t => t.filePath === filePath);
      if (idx === -1) return;
      openTabs.splice(idx, 1);

      // If the closed tab was active, switch to an adjacent tab
      if (activeTabPath === filePath) {
        if (openTabs.length === 0) {
          activeTabPath = null;
          kovixEditor.closeFile();
        } else {
          // Switch to the tab that's now at the same index, or the last one
          const newIdx = Math.min(idx, openTabs.length - 1);
          activeTabPath = openTabs[newIdx].filePath;
          kovixEditor.openFile(activeTabPath);
        }
      }
      renderTabs();
    }

    function switchTab(filePath) {
      if (activeTabPath === filePath) return;
      activeTabPath = filePath;
      kovixEditor.openFile(filePath);
      renderTabs();
      // Update file tree active state
      if (fileTree) fileTree.setActiveFile(filePath);
    }

    function renderTabs() {
      const tabBar = document.getElementById('tab-bar');
      tabBar.innerHTML = '';

      for (const tab of openTabs) {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (tab.filePath === activeTabPath ? ' active' : '');

        // Icon
        const icon = document.createElement('span');
        icon.className = 'tab-icon';
        icon.textContent = getFileIcon(tab.name);
        tabEl.appendChild(icon);

        // Name
        const name = document.createElement('span');
        name.className = 'tab-name';
        name.textContent = tab.name;
        name.title = tab.filePath;
        tabEl.appendChild(name);

        // Close button
        const closeBtn = document.createElement('button');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '&#10005;';
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(tab.filePath);
        });
        tabEl.appendChild(closeBtn);

        // Click to switch
        tabEl.addEventListener('click', () => switchTab(tab.filePath));

        // Middle-click to close
        tabEl.addEventListener('auxclick', (e) => {
          if (e.button === 1) {
            e.preventDefault();
            closeTab(tab.filePath);
          }
        });

        tabBar.appendChild(tabEl);
      }
    }

    // Mini file icon helper for tabs (reuse from filetree)
    function getFileIcon(name) {
      const EXT_ICONS = {
        '.js':'📜','.jsx':'📜','.ts':'📘','.tsx':'📘','.vue':'💚',
        '.css':'🎨','.scss':'🎨','.less':'🎨','.html':'🌐','.htm':'🌐',
        '.json':'📋','.yaml':'📋','.yml':'📋','.toml':'📋','.xml':'📋',
        '.md':'📝','.txt':'📄','.py':'🐍','.rb':'💎','.go':'🔵',
        '.rs':'🦀','.java':'☕','.c':'⚙️','.cpp':'⚙️','.sh':'🔧',
      };
      const ext = name.includes('.') ? '.' + name.split('.').pop().toLowerCase() : '';
      return EXT_ICONS[ext] || '📄';
    }

    // ---- File selection handler ----

    async function handleFileSelect(filePath) {
      if (kovixEditor) {
        await kovixEditor.openFile(filePath);
      }
    }

    // ---- Change resolution handler ----

    async function handleChangeResolved(filePath) {
      if (fileTree) {
        const snapshot = await api.getPendingSnapshot();
        const paths = (snapshot || []).map(e => e.filePath);
        fileTree.setPendingPaths(paths);
      }
      if (kovixEditor && kovixEditor.currentFilePath === filePath) {
        await kovixEditor.openFile(filePath);
      }
    }

    // ---- Pending changes sync ----

    function setupPendingChangesSync() {
      api.onPendingChanged((entries) => {
        if (!Array.isArray(entries)) return;
        if (fileTree) {
          const paths = entries.map(e => e.filePath);
          fileTree.setPendingPaths(paths);
        }
        if (kovixEditor && kovixEditor.currentFilePath) {
          const currentPending = entries.find(e => e.filePath === kovixEditor.currentFilePath);
          if (currentPending) {
            kovixEditor.openFile(kovixEditor.currentFilePath);
          }
        }
        // Update tab pending indicators
        renderTabs();
      });
    }

    // ---- Resize handles ----

    function setupResizeHandles() {
      const handle1 = document.getElementById('resize-tree-editor');
      const paneTree = document.getElementById('pane-filetree');
      makeResizable(handle1, paneTree, 'width', 180, 420);

      const handle2 = document.getElementById('resize-editor-chat');
      const paneChat = document.getElementById('pane-chat');
      makeResizable(handle2, paneChat, 'width', 280, 600, true);
    }

    function makeResizable(handle, pane, prop, minSize, maxSize, invert = false) {
      let startPos = 0;
      let startSize = 0;

      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startPos = prop === 'width' ? e.clientX : e.clientY;
        startSize = pane.offsetWidth;
        handle.classList.add('active');

        const onMouseMove = (e) => {
          const delta = (prop === 'width' ? e.clientX : e.clientY) - startPos;
          let newSize = invert ? startSize - delta : startSize + delta;
          newSize = Math.max(minSize, Math.min(maxSize, newSize));
          pane.style.width = newSize + 'px';

          if (kovixEditor) {
            if (kovixEditor.editor) kovixEditor.editor.layout();
            if (kovixEditor.diffEditor) kovixEditor.diffEditor.layout();
          }
        };

        const onMouseUp = () => {
          handle.classList.remove('active');
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // Initialize
    initLayout().catch(err => console.error('[Layout] Init failed:', err));
  </script>
</body>
</html>
